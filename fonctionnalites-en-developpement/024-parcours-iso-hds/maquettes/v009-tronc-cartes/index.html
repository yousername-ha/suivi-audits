dialog.addEventListener('pointercancel',()=>backdropPress=null);
dialog.addEventListener('close',()=>{render();if(lastFocus)document.querySelector(lastFocus)?.focus({preventScroll:true})});
function openNode(id){selected=id;const display=displays.find(d=>d.id===id);if(display&&!displays.some(d=>d.key===selectedDisplay&&d.id===id))selectedDisplay=display.key;const n=nodes.find(n=>n.id===id),r=record(n);render();show(`<div class="eyebrow">${group(n).name} · ${state.scope==='ght'?'GHT A':'Établissement B'}</div><h2 id="dialog-title">${esc(n.title)}</h2><p class="muted">${esc(n.sub)}</p><div class="dialog-meta"><span class="pill ${r.status}" id="status-label">${labels[r.status]}</span><span class="pill">${esc(n.ref)}</span></div><p class="muted" style="font-size:12px">Dépliez une sous-action pour consulter l’attendu et préparer votre travail.</p>${n.actions.map((a,i)=>`<details class="subaction" data-action="${a.id}"><summary>${icon(n.id)}<span><b>${esc(a.title)}</b><small>${esc(a.description)}</small></span><span class="prepared-indicator" aria-label="${r.checks[a.artifactIndex]?'Préparée':'À préparer'}">${r.checks[a.artifactIndex]?'✓':''}</span></summary><div class="expected"><h4>L’attendu</h4><p>${esc(a.expected)}</p><div class="deliverable"><b>Exemple de livrable</b><p>${esc(a.deliverable)}</p><small>Format proposé, non imposé par la norme.</small></div><label class="check"><input type="checkbox" data-check="${a.artifactIndex}" ${r.checks[a.artifactIndex]?'checked':''}>Repère préparé · simulation locale</label></div></details>`).join('')}${r.notes?`<div class="hint" id="shared-note"><b>Note commune au module</b><p>${esc(r.notes)}</p></div>`:''}<div class="proof"><span id="proof-label">${r.proof?'PRE-DEMO-001 · Document fictif lié':'Aucune preuve liée dans la démo'}</span><button id="proof">${r.proof?'Retirer le lien démo':'Associer une preuve démo'}</button></div><a class="source-link" href="${esc(n.source)}" target="_blank" rel="noopener noreferrer">Consulter la référence officielle ↗</a><div class="hint">À retrouver dans <b>${esc(n.module)}</b>.<br>Mêmes objets et mêmes droits dans la future intégration. Ici, seul un espace de démonstration est disponible.</div><div class="dialog-actions"><button id="module">Ouvrir le module · démo</button><button id="start">Mettre en cours</button><button id="submit" class="primary">Préparer la revue</button>${r.status==='review'?'<button id="review" class="primary">Confirmer la revue · démo</button>':''}${r.status==='done'?'<button id="reopen">Remettre à revoir</button>':''}</div><p class="module-note">Cocher ces repères ne démontre pas la conformité. Le texte applicable, les preuves réelles et la revue restent nécessaires.</p>`);
dialog.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{r.checks[Number(c.dataset.check)]=c.checked;if(r.status==='done')r.status='review';else if(r.status==='todo')r.status='progress';save();dialog.querySelector('#status-label').textContent=labels[r.status];const indicator=c.closest('details').querySelector('.prepared-indicator');indicator.textContent=c.checked?'✓':'';indicator.setAttribute('aria-label',c.checked?'Préparée':'À préparer')});dialog.querySelector('#proof').onclick=()=>{r.proof=!r.proof;if(r.status==='done')r.status='review';save();openNode(id);dialog.querySelector('#proof').focus()};dialog.querySelector('#module').onclick=()=>moduleView(id);dialog.querySelector('#start').onclick=()=>{r.status='progress';save();openNode(id);dialog.querySelector('#start').focus()};dialog.querySelector('#submit').onclick=()=>{if(!r.checks.every(Boolean)||!r.proof){toast('Pour cet essai, préparez tous les repères et associez la preuve fictive.');return}r.status='review';save();openNode(id);dialog.querySelector('#review').focus()};dialog.querySelector('#review')?.addEventListener('click',()=>{if(!r.checks.every(Boolean)||!r.proof){toast('Repères ou preuve manquants pour cette simulation.');return}r.status='done';save();openNode(id);toast('Revue simulée enregistrée. Aucune conformité attribuée.')});dialog.querySelector('#reopen')?.addEventListener('click',()=>{r.status='review';save();openNode(id)})}
function moduleView(id){const n=nodes.find(n=>n.id===id),r=record(n);show(`<div class="eyebrow">Module de démonstration · données communes au parcours</div><h2 id="dialog-title">${esc(n.module)}</h2><div class="hint">Simulation du raccordement, sans API métier. Cette fiche partage le même enregistrement local que l’étape du parcours ; elle ne remplace pas le véritable module.</div><h3>${esc(n.title)}</h3><div class="dialog-meta"><span class="pill">DEMO-${esc(state.scope)}-${esc(n.id)}</span><span class="pill ${r.status}">${labels[r.status]}</span></div>${n.artifacts.map((a,i)=>`<label class="check" style="margin:12px 0"><input type="checkbox" data-module-check="${i}" ${r.checks[i]?'checked':''}>${esc(a)}</label>`).join('')}<label class="notes">Note de travail fictive<textarea id="notes" maxlength="2000" placeholder="Votre note locale, commune aux deux vues…">${esc(r.notes||'')}</textarea></label><p class="module-note">Ne saisissez aucune donnée sensible dans cette démonstration.</p><div class="dialog-actions"><button id="back-node">Retour au parcours</button><button id="save-module" class="primary">Enregistrer dans la démo</button></div>`);dialog.querySelector('#back-node').onclick=()=>openNode(id);dialog.querySelector('#save-module').onclick=()=>{const next=[...dialog.querySelectorAll('[data-module-check]')].map(c=>c.checked),notes=dialog.querySelector('#notes').value,changed=JSON.stringify(next)!==JSON.stringify(r.checks)||notes!==r.notes;r.checks=next;r.notes=notes;if(changed&&r.status==='done')r.status='review';else if(changed&&r.status==='todo')r.status='progress';save();moduleView(id);dialog.querySelector('#save-module').focus();toast('Enregistrement local mis à jour, également visible dans le parcours.')}}
function modules(){show(`<div class="eyebrow">Vue d’ensemble · simulation</div><h2 id="dialog-title">Les travaux du périmètre</h2><p class="muted">Retrouvez les mêmes repères depuis les modules et depuis le parcours.</p><div class="module-list">${nodes.map(n=>`<button data-module="${n.id}"><span><b>${esc(n.title)}</b><br><small>${esc(n.module)}</small></span><span>${summary(n)}</span></button>`).join('')}</div>`);dialog.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>moduleView(b.dataset.module))}
function sources(){show(`<div class="eyebrow">Sources & limites</div><h2 id="dialog-title">Un parcours guidé, pas une certification</h2><p>Les 16 étapes et 26 sous-actions reprennent le contenu de la maquette v002. L’arbre est une organisation visuelle proposée ; ses branches ne sont pas des prérequis normatifs.</p><div class="hint">La progression, les repères cochés et la preuve fictive ne démontrent ni la conformité ni la suffisance des preuves. Vérifier le texte ISO détenu sous licence et le référentiel HDS applicable.</div><p><a href="https://www.iso.org/standard/27001" target="_blank" rel="noopener noreferrer">ISO/IEC 27001:2022 ↗</a></p><p><a href="https://www.iso.org/standard/88435.html" target="_blank" rel="noopener noreferrer">Amendement 1:2024 ↗</a></p><p><a href="https://esante.gouv.fr/sites/default/files/media_entity/documents/referentiel_certification_hds---fr--v2.pdf" target="_blank" rel="noopener noreferrer">ANS · Référentiel HDS v2.0 ↗</a></p><p><a href="https://esante.gouv.fr/ens/offre/hds" target="_blank" rel="noopener noreferrer">ANS · Certification HDS ↗</a></p><p class="module-note">Sources héritées du dossier documenté le 22 octobre 2026. Il ne s’agit pas d’une couverture exhaustive exigence par exigence. L’arbre n’impose pas EBIOS RM.</p>`)}
function reset(){lastFocus='#options';show(`<h2 id="dialog-title">Réinitialiser cette maquette ?</h2><p>La progression et les notes des deux périmètres fictifs de cette version seront effacées. Les autres maquettes sont conservées.</p><div class="dialog-actions"><button id="cancel-reset">Annuler</button><button id="confirm-reset">Réinitialiser l’essai</button></div>`);document.querySelector('#cancel-reset').onclick=()=>dialog.close();document.querySelector('#confirm-reset').onclick=()=>{state.records={};save();dialog.close();toast('La démonstration a été réinitialisée.')};document.querySelector('#cancel-reset').focus()}
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('motion-paused',document.hidden));
render();
})();
</script></body></html>

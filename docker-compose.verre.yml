# Évaluation de la refonte « Verre » (branche refonte-verre seulement, décision du RSSI du 26/11/2026) :
#   docker compose -f docker-compose.verre.yml up --build
# Puis ouvrir http://localhost:5173 : aucune page de connexion, compte fictif administrateur, jeu de démonstration chargé,
# style d'instance « Verre ». Pile jetable : données dans ./.donnees-verre (ignoré par git) ; pour repartir de zéro,
#   docker compose -f docker-compose.verre.yml down   puis supprimer le dossier .donnees-verre.
# Seule la « porte » (scripts/evaluation-verre/porte.ts) est publiée, sur 127.0.0.1 : l'interface et l'API restent
# internes à la pile. Ne jamais déployer ce fichier sur un serveur, ni le reporter hors de refonte-verre.
name: suivi-audits-verre

x-node: &node
  image: node:26-alpine
  working_dir: /work
  environment: &env
    DB_HOST: db
    DB_USER: postgres
    DB_PASSWORD: ''
    SECRETS_DIR: /dev-secrets
    COOKIE_SECURE: 'false'
    PUBLIC_URL: http://localhost:5173
    # Pas de second facteur à enrôler : la session d'évaluation est ouverte par la porte.
    MFA_REQUIRED: 'false'
    LOG_LEVEL: info
  volumes:
    # Le code de l'hôte est lu (lecture seule) puis copié dans un volume Linux à chaque démarrage de l'API : sous Windows,
    # le dossier partagé ignore la casse et « Alertes.ts » y désigne « alertes.ts » (mauvais module chargé, écran noir).
    - .:/source:ro
    - verre-code:/work
    - ./.donnees-verre/secrets:/dev-secrets
    # Dépendances dans des volumes Docker (système de fichiers Linux), jamais sur le disque de l'hôte : sous Windows, les
    # liens symboliques de pnpm dans le dossier partagé ne sont pas fiables.
    - verrenodemodules:/work/node_modules
    - verre-nm-api:/work/apps/api/node_modules
    - verre-nm-web:/work/apps/web/node_modules
    - verre-nm-shared:/work/packages/shared/node_modules
    - verre-nm-ui:/work/packages/ui/node_modules
    - verre-nm-e2e:/work/tests/e2e/node_modules

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: suivi
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./.donnees-verre/postgres18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d suivi']
      interval: 5s
      retries: 20

  api:
    <<: *node
    command: >
      sh -c "rm -f node_modules/.installation-verre-terminee && npm i -g pnpm@10.34.6 >/dev/null 2>&1 &&
             echo 'Copie du code dans le volume de la pile…' &&
             find /work -mindepth 1 -name node_modules -prune -o -type f -exec rm -f {} + &&
             cd /source && find . \( -name node_modules -o -name .git -o -name .donnees-verre \) -prune -o -type f -print |
             tar -cf - -T - | tar -C /work -xf - && cd /work &&
             pnpm install --frozen-lockfile && touch node_modules/.installation-verre-terminee &&
             node -e \"const f='/dev-secrets/doc_master_key',fs=require('fs');fs.mkdirSync('/dev-secrets',{recursive:true});fs.existsSync(f)||fs.writeFileSync(f,require('crypto').randomBytes(32).toString('base64'))\" &&
             pnpm --filter @suivi/api dev"
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *node
    command: sh -c "npm i -g pnpm@10.34.6 >/dev/null 2>&1 && until [ -f node_modules/.installation-verre-terminee ]; do sleep 2; done && pnpm --filter @suivi/web dev --host 0.0.0.0"
    environment:
      API_URL: http://api:8080
    depends_on: [api]

  porte:
    <<: *node
    command: sh -c "npm i -g pnpm@10.34.6 >/dev/null 2>&1 && echo 'Porte en attente de l’API (premier démarrage, installation des dépendances, quelques minutes)…' && until wget -q -O /dev/null http://api:8080/healthz 2>/dev/null; do sleep 3; done && pnpm --filter @suivi/api exec tsx --conditions=source ../../scripts/evaluation-verre/porte.ts"
    ports:
      - '127.0.0.1:5173:5173'
    depends_on: [api, web]

volumes: # copie du code et dépendances (pas des données)
  verre-code:
  verrenodemodules:
  verre-nm-api:
  verre-nm-web:
  verre-nm-shared:
  verre-nm-ui:
  verre-nm-e2e:

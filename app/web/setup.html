<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Installation — Suivi des audits SMSI</title>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/common.js" defer></script>
<script src="/assets/setup.js" defer></script>
</head>
<body>
<main class="auth-wrap">
  <div class="auth">
    <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span>Installation initiale</span></div>
    <div class="card">
      <h1>Créer le compte administrateur</h1>
      <p class="muted small">Le jeton d'installation est affiché dans les journaux du conteneur au premier démarrage :<br><code class="mono">docker compose logs app | grep -A3 JETON</code></p>
      <form id="f-setup" autocomplete="off">
        <label class="fld">Jeton d'installation<input name="token" required autocomplete="off" spellcheck="false" class="mono"></label>
        <div class="grid2">
          <label class="fld">Identifiant<input name="username" required maxlength="64" autocomplete="username" pattern="[A-Za-z0-9._@\-]{2,64}"></label>
          <label class="fld">Nom affiché<input name="displayName" maxlength="120" autocomplete="name"></label>
        </div>
        <label class="fld">Adresse e-mail (facultatif)<input name="email" type="email" maxlength="200" autocomplete="email"></label>
        <label class="fld">Mot de passe<input name="password" type="password" required autocomplete="new-password"><span class="hint" id="pwHint"></span></label>
        <label class="fld">Confirmation<input name="confirm" type="password" required autocomplete="new-password"></label>
        <div class="alert err" hidden></div>
        <button class="btn primary" type="submit">Créer le compte</button>
      </form>
    </div>
    <p class="foot">La double authentification sera configurée à l'étape suivante.</p>
  </div>
</main>
</body>
</html>

<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASTRA — propositions cartographie SMSI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button{font:inherit}#app{min-height:1280px;display:grid;grid-template-columns:228px 1fr}aside{background:var(--nav);color:#fff;padding:32px 20px;display:flex;flex-direction:column;gap:32px}.brand{font-size:25px;font-weight:800;letter-spacing:3px;display:flex;gap:12px;align-items:center}.mark{width:39px;height:39px;border:1px solid #ffffff66;border-radius:10px;display:grid;place-items:center;font-size:24px}.brand small{display:block;font-size:9px;letter-spacing:1.6px;margin-top:5px;opacity:.7}.nav-heading{font-size:9px;font-weight:700;letter-spacing:1.8px;opacity:.55;margin-bottom:15px}.nav-item{padding:12px 14px;margin:4px 0;color:#e9e9f0;display:flex;align-items:center;gap:12px;border-radius:calc(var(--radius)*.7);font-size:12px}.nav-item.on{background:#ffffff1c;color:white;border-left:3px solid var(--accent);font-weight:700}.nav-icon{width:17px;font-size:16px;opacity:.85}.nav-bottom{margin-top:auto;border-top:1px solid #ffffff25;padding-top:20px;font-size:11px;line-height:1.9;opacity:.75}main{padding:0 38px 24px;min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.search{background:var(--surface);border:1px solid var(--line);padding:10px 16px;border-radius:calc(var(--radius)*.7);width:275px;display:flex;justify-content:space-between}.top-right{display:flex;align-items:center;gap:18px}.avatar{border-radius:50%;width:33px;height:33px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700}.proposal{font-size:9px;letter-spacing:1.8px;color:var(--accent);font-weight:800;margin-top:23px}.page-title{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:12px 0 22px}h1,h2,h3{font-family:var(--font);margin:0;letter-spacing:-.6px}h1{font-size:29px;line-height:1.2}h2{font-size:19px}h3{font-size:14px}p{line-height:1.55;margin:7px 0;color:var(--muted)}.subtitle{font-size:12px;margin-top:10px}.actions{display:flex;gap:8px;flex-shrink:0}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:calc(var(--radius)*.7);font-size:12px;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--button-ink)}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:20px}.tab{padding:9px 13px;color:var(--muted);font-size:12px;border-radius:var(--radius)}.tab.on{background:var(--soft);color:var(--accent);font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--surface);padding:17px 22px;border:1px solid var(--line);border-radius:var(--radius)}.stat .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.stat .value{font:700 29px var(--font);margin-top:7px}.stat small{font-size:10px;color:var(--muted)}.stat .value span{font:12px Arial,sans-serif;color:var(--accent);margin-left:8px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}.kicker{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);margin-bottom:7px}.muted{color:var(--muted)}.small{font-size:11px}.badge{display:inline-block;background:var(--soft);color:var(--accent);border:1px solid var(--line);border-radius:calc(var(--radius)*.75);padding:5px 9px;font-size:10px;white-space:nowrap}.legend{display:flex;gap:18px;font-size:11px;color:var(--muted);padding:16px 0 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}.dot.alt{background:var(--alt)}.lower{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row strong{font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.footer{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:19px;letter-spacing:.4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.process-card{padding:20px;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--radius);background:var(--surface);min-height:190px}.process-card .code{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:1px;margin-bottom:15px}.process-card p{font-size:12px}.process-card .meta{display:flex;gap:6px;margin-top:20px}.meter{background:var(--soft);height:7px;border-radius:5px;overflow:hidden;margin:14px 0}.meter b{display:block;background:var(--accent);height:100%}.mini-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.flow-step{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:22px 15px;background:var(--surface);min-width:0}.flow-steps{display:flex;gap:12px;align-items:stretch;margin:18px 0}.flow-step h3{font-size:15px;margin:14px 0}.flow-step p{font-size:11px}.step-no{font-size:27px;color:var(--accent);font-family:var(--font);font-weight:700}.arrow{display:flex;align-items:center;color:var(--accent);font-size:21px}.details{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}.fact{padding:15px 0;border-bottom:1px solid var(--line);font-size:12px;display:grid;grid-template-columns:150px 1fr;gap:12px}.fact span{color:var(--muted)}.hero{background:var(--nav);color:#fff;padding:26px;border-radius:var(--radius);margin-bottom:18px}.hero p{color:#ffffffb8;max-width:740px}.hero h2{font-size:26px}.metric-big{font-size:44px;font-weight:700;color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);padding:14px 12px;background:var(--soft)}td{padding:18px 12px;border-bottom:1px solid var(--line);line-height:1.45}td small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}.circle{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--soft);color:var(--accent);font-weight:bold}.callout{padding:15px 18px;border-left:3px solid var(--accent);background:var(--soft);font-size:12px;color:var(--ink);margin-top:18px;line-height:1.6}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.timeline article{border-top:3px solid var(--accent);padding-top:15px}.timeline h3{margin:12px 0}.timeline p{font-size:12px}.check{color:var(--alt);font-weight:bold}.chart{width:100%;height:160px}.map{width:100%;height:375px;display:block}.map text{font-family:Arial,sans-serif}.map .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}.map .band{fill:var(--soft)}.map .accent{fill:var(--accent)}.map .alt{fill:var(--alt)}.map .edge{stroke:var(--accent);fill:none;stroke-width:1.8;opacity:.6}.map .name{fill:var(--ink);font-size:13px;font-weight:600}.map .sub{fill:var(--muted);font-size:10px}.map .lane-title{fill:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px}.rail #app{grid-template-columns:100px 1fr}.rail aside{padding:28px 12px;align-items:center}.rail .brand-copy,.rail .nav-heading,.rail .nav-item .nav-label,.rail .nav-bottom{display:none}.rail .nav-item{padding:14px;justify-content:center}.rail .mark{width:44px;height:44px}.floating #app{grid-template-columns:244px 1fr}.floating aside{margin:18px 0 18px 18px;border-radius:24px;padding-top:24px}.top #app{display:block}.top aside{height:82px;flex-direction:row;align-items:center;gap:30px;padding:0 36px}.top aside nav{display:flex;gap:4px;margin-left:auto}.top aside .nav-heading,.top aside .nav-bottom,.top aside .nav-secondary{display:none}.top .nav-item{font-size:11px;padding:10px}.top main{max-width:1540px;margin:auto}.top .topbar{height:58px}.top .map{height:306px}.technical main{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-blend-mode:soft-light}.technical .panel,.technical .stat{box-shadow:inset 3px 0 var(--accent)}.soft .panel,.soft .stat{border-color:transparent;box-shadow:0 8px 30px #163e3010}.studio .hero{background:linear-gradient(115deg,var(--nav),var(--accent))}.editorial .page-title{border-top:3px solid var(--accent);padding-top:20px}.editorial h1{font-size:33px;font-weight:normal}.luxury h1,.luxury h2{font-weight:normal}.luxury .panel{border-top:2px solid var(--accent)}.mono .panel,.mono .stat{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--line)}.mono h1{text-transform:uppercase;font-size:26px;letter-spacing:-1px}.playful .stat:nth-child(2){background:var(--accent);color:#fff}.playful .stat:nth-child(2) .label,.playful .stat:nth-child(2) small,.playful .stat:nth-child(2) .value span{color:#fff}.calm .panel,.calm .stat{box-shadow:0 5px 18px #5148600b;border-color:transparent}.dark .panel-head h2{letter-spacing:0}.variant-label{color:var(--muted);font-size:11px}.technical .proposal{background:var(--surface);display:inline-block;padding:7px 10px}.top .proposal{margin-top:18px}
</style><div id="app"></div>
<script>
const views=[['01-vue-ensemble','Vue d’ensemble','Architecture du SMSI'],['02-processus-pilotage','Processus de pilotage','Orienter, arbitrer et améliorer'],['03-processus-realisation','Processus de réalisation','Les activités au cœur du SMSI'],['04-processus-support','Processus support','Les ressources qui rendent le SMSI opérant'],['05-flux-interactions','Flux et interactions','De l’expression du besoin à l’amélioration'],['06-fiche-processus','Fiche processus','PR-04 · Gérer les risques'],['07-risques-mesures','Risques et mesures','Rattachements et décisions de traitement'],['08-indicateurs','Indicateurs de pilotage','Mesurer l’efficacité des processus'],['09-responsabilites','Responsabilités','Répartition des rôles · matrice RACI'],['10-revue-direction','Revue de direction','Décisions, priorités et suivi du SMSI']];
const proc=[['PR-01','Définir la stratégie','Direction générale','Pilotage'],['PR-02','Piloter le SMSI','Responsable SSI','Pilotage'],['PR-03','Améliorer en continu','Responsable qualité','Pilotage'],['PR-04','Gérer les risques','Responsable SSI','Réalisation'],['PR-05','Déployer les mesures','Équipe sécurité','Réalisation'],['PR-06','Traiter les incidents','Équipe exploitation','Réalisation'],['PR-07','Gérer les compétences','Ressources humaines','Support'],['PR-08','Maîtriser les fournisseurs','Responsable achats','Support'],['PR-09','Maintenir le SI','Équipe infrastructure','Support']];
const badge=t=>`<span class="badge">${t}</span>`;
const row=(title,sub,right)=>`<div class="row"><div><strong>${title}</strong><small>${sub}</small></div>${badge(right)}</div>`;
const panel=(title,body,kicker='SMSI · DÉMONSTRATION')=>`<section class="panel"><div class="panel-head"><div><div class="kicker">${kicker}</div><h2>${title}</h2></div>${badge('FICTIF')}</div>${body}</section>`;
function map(){let s=`<svg class="map" viewBox="0 0 1120 370" role="img" aria-label="Carte de neuf processus fictifs"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs>`;['PILOTAGE','RÉALISATION','SUPPORT'].forEach((label,l)=>{let y=l*120;s+=`<rect class="band" x="0" y="${y}" width="1120" height="105" rx="8"/><text class="lane-title" x="20" y="${y+31}">${label}</text><text class="sub" x="20" y="${y+50}">${['Orienter & décider','Mettre en œuvre','Donner les moyens'][l]}</text>`;for(let c=0;c<3;c++){let p=proc[l*3+c],x=190+c*306;s+=`<rect class="node" x="${x}" y="${y+14}" width="278" height="77" rx="var(--radius)"/><rect class="accent" x="${x}" y="${y+14}" width="4" height="77"/><text class="sub" x="${x+16}" y="${y+34}">${p[0]}</text><text class="name" x="${x+16}" y="${y+55}">${p[1]}</text><text class="sub" x="${x+16}" y="${y+76}">${p[2]}</text>`;if(c<2)s+=`<path class="edge" d="M${x+278} ${y+52} H${x+304}" marker-end="url(#arr)"/>`;if(l<2)s+=`<path class="edge" d="M${x+139} ${y+91} V${y+132}" marker-end="url(#arr)" stroke-dasharray="4 4"/>`;}});return s+'</svg>'}
function cards(fam){return `<div class="grid3">${proc.filter(p=>p[3]===fam).map((p,i)=>`<article class="process-card"><div class="code">${p[0]} / ${fam.toUpperCase()}</div><h2>${p[1]}</h2><p>Pilote : ${p[2]}</p><div class="meter"><b style="width:${[84,72,91][i]}%"></b></div><div class="mini-label"><span>Revue documentaire</span><span>${[84,72,91][i]} %</span></div><div class="meta">${badge([3,5,2][i]+' activités')}${badge([2,4,3][i]+' indicateurs')}</div></article>`).join('')}</div>`}
function table(headers,rows,cls=''){return `<table class="${cls}"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function content(n){if(n===0)return panel('Une architecture commune, trois familles de processus',map(),'CARTOGRAPHIE · PÉRIMÈTRE SMSI')+`<div class="lower">${panel('À examiner lors de la prochaine revue',row('Clarifier les interfaces fournisseurs','PR-08 · Responsable achats','À examiner')+row('Actualiser le traitement des risques','PR-04 · Responsable SSI','En cours'))}${panel('Lecture de la carte','<p>Les processus de pilotage fixent le cap. Les processus de réalisation appliquent la politique de sécurité. Les supports apportent les moyens.</p><div class="legend"><span><i class="dot"></i>Flux illustratif</span><span><i class="dot alt"></i>Famille de processus</span></div>')}</div>`;
if(n>=1&&n<=3){let fam=['','Pilotage','Réalisation','Support'][n];let texts={Pilotage:['Politique de sécurité','Objectifs du SMSI','Décisions de revue'],Réalisation:['Évaluation des risques','Plan de traitement','Gestion des incidents'],Support:['Compétences et sensibilisation','Achats et contrats','Maintenance et continuité']};return cards(fam)+`<div class="lower">${panel('Activités et livrables',table(['Activité','Livrable','Cadence'],texts[fam].map((x,i)=>[x,['Document validé','Tableau de suivi','Compte rendu'][i],['Annuelle','Mensuelle','Trimestrielle'][i]])))}${panel('Interfaces avec les autres familles',row('Entrées','Politique, besoins et exigences','3 interfaces')+row('Sorties','Décisions, preuves et plans','4 interfaces')+row('Boucle d’amélioration','Retours de revue et incidents','Active'))}</div><div class="callout">Lecture proposée : chaque processus conserve un pilote, ses activités et ses liens. Les couleurs distinguent les familles, sans exprimer une certification.</div>`;}
if(n===4)return panel('Chaîne de valeur du SMSI',`<div class="flow-steps">${['Qualifier le besoin','Apprécier les risques','Mettre en œuvre','Contrôler','Améliorer'].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<article class="flow-step"><div class="step-no">0${i+1}</div><h3>${x}</h3><p>${['Contexte, périmètre et exigences','Scénarios, impacts et décisions','Mesures, ressources et preuves','Indicateurs, tests et audits','Actions correctives et revue'][i]}</p>${badge(['PR-02','PR-04','PR-05','PR-03','PR-03'][i])}</article>`).join('')}</div><div class="callout">↺ Les résultats des contrôles alimentent la revue et la réévaluation. Flux illustratifs à valider avec les pilotes.</div>`)+`<div class="lower">${panel('Interfaces documentées',table(['Source','Destination','Échange'],[['Gestion des risques','Mesures de sécurité','Plan de traitement'],['Gestion des incidents','Gestion des risques','Retour d’expérience'],['Revue de direction','Pilotage du SMSI','Décision et ressources']]))}${panel('Points de coordination',row('Comité sécurité','Arbitrage et suivi du traitement','Mensuel')+row('Réunion opérationnelle','Incidents et actions prioritaires','Hebdomadaire')+row('Revue de direction','Efficacité du SMSI','Annuelle'))}</div>`;
if(n===5)return `<div class="hero"><div class="kicker" style="color:inherit">PROCESSUS PR-04</div><h2>Gérer les risques de sécurité de l’information</h2><p>Identifier les scénarios, apprécier les impacts, décider du traitement et suivre les réévaluations.</p></div><div class="details">${panel('Identité du processus',`<div class="fact"><span>Pilote</span><strong>Responsable SSI · FICTIF</strong></div><div class="fact"><span>Famille</span><strong>Réalisation</strong></div><div class="fact"><span>Périmètre</span><strong>Organisation de démonstration</strong></div><div class="fact"><span>Entrées</span><strong>Contexte, actifs, incidents, exigences</strong></div><div class="fact"><span>Sorties</span><strong>Registre des risques et plan de traitement</strong></div><div class="fact"><span>Prochaine revue</span><strong>30 novembre 2026 · exemple</strong></div>`)}${panel('Objets associés',row('Risques du processus','Registre central','6 risques')+row('Mesures du traitement','Annexe A ISO 27001:2022','8 liens')+row('Plans d’action','Suivi opérationnel','4 actions')+row('Preuves et documents','Dossier partagé','12 références'))}</div><div class="callout">Ces valeurs sont fictives et servent à comparer la lisibilité des styles. Elles ne décrivent pas un état de conformité réel.</div>`;
if(n===6)return panel('Risques associés aux processus',table(['Risque / processus','Appréciation','Mesures liées','Suivi'],[['Indisponibilité du SI<small>PR-09 · Maintenir le SI</small>',badge('Élevé'),'A-8.13 · Sauvegarde<br>A-8.14 · Redondance',badge('En traitement')],['Accès inapproprié<small>PR-05 · Déployer les mesures</small>',badge('Modéré'),'A-5.15 · Contrôle d’accès<br>A-8.2 · Droits privilégiés',badge('À réévaluer')],['Rupture fournisseur<small>PR-08 · Maîtriser les fournisseurs</small>',badge('Élevé'),'A-5.19 · Relations fournisseurs',badge('En cours')],['Erreur de manipulation<small>PR-07 · Gérer les compétences</small>',badge('Modéré'),'A-6.3 · Sensibilisation',badge('Planifié')]]))+`<div class="lower">${panel('Traitement et preuve',row('Consolider le plan de sauvegarde','Équipe infrastructure','En cours')+row('Réviser les habilitations','Responsable SSI','À planifier'))}${panel('Principe de lecture','<p>Une mesure liée documente une correspondance. La réduction du risque nécessite une réévaluation explicite et des preuves adaptées.</p>')}</div>`;
if(n===7)return `<div class="grid3">${[['Revues de processus','8 / 9','Revues réalisées sur la période',89],['Actions terminées','18 / 24','Actions de la période clôturées',75],['Pilotes désignés','9 / 9','Responsabilités documentées',100]].map(([a,b,c,d])=>panel(a,`<div class="metric-big">${b}</div><p>${c}</p><div class="meter"><b style="width:${d}%"></b></div>`)).join('')}</div><div class="lower">${panel('Suivi des revues · six mois',`<svg class="chart" viewBox="0 0 600 170"><path d="M30 130H580 M30 80H580 M30 30H580" stroke="var(--line)"/><polyline points="40,130 140,110 240,102 340,70 440,60 550,30" fill="none" stroke="var(--accent)" stroke-width="4"/>${[40,140,240,340,440,550].map((x,i)=>`<circle cx="${x}" cy="${[130,110,102,70,60,30][i]}" r="5" fill="var(--accent)"/><text x="${x}" y="160" text-anchor="middle" fill="var(--muted)" font-size="11">${['Mai','Juin','Juil.','Août','Sept.','Oct.'][i]}</text>`).join('')}</svg>`)}${panel('Indicateurs à examiner',row('Délai de traitement des incidents','Médiane de la période','2,4 jours')+row('Couverture des preuves','Mesures documentées','78 %')+row('Revue restante','PR-08 · Fournisseurs','1 revue'))}</div><div class="callout">Indicateurs fictifs de démonstration. Chaque indicateur réel doit conserver sa définition, sa source et sa période de calcul.</div>`;
if(n===8)return panel('Qui décide, réalise et contribue ?',table(['Processus','Direction','RSSI','DSI','Qualité','Achats'],[['Définir la stratégie','A','R','C','C','I'],['Piloter le SMSI','A','R','C','C','I'],['Gérer les risques','A','R','C','C','C'],['Déployer les mesures','I','A','R','C','C'],['Traiter les incidents','I','A','R','C','I'],['Maîtriser les fournisseurs','I','C','C','I','R']].map(r=>r.map((v,i)=>i?`<span class="circle">${v}</span>`:v)),'matrix')+'<div class="legend"><span>R · Réalise</span><span>A · Approuve</span><span>C · Consulté</span><span>I · Informé</span></div>','ORGANISATION · EXEMPLE DE RÉPARTITION')+'<div class="callout">Proposition de présentation RACI, à adapter aux responsabilités de l’organisation. Ce tableau est une maquette de comparaison visuelle.</div>';
return `<div class="hero"><div class="kicker" style="color:inherit">REVUE DE DIRECTION · OCTOBRE 2026</div><h2>Faire le point. Décider. Suivre les engagements.</h2><p>Une lecture consolidée des processus, des risques et des actions pour préparer les arbitrages.</p></div><div class="grid2">${panel('Décisions à préparer',row('Prioriser la résilience des services','PR-09 · Scénarios et moyens','Arbitrage')+row('Renforcer la maîtrise des tiers','PR-08 · Contrats et suivi','Décision')+row('Planifier les prochains audits','PR-03 · Périmètre et ressources','Validation'))}${panel('État du programme',row('Revues de processus réalisées','Période illustrative','8 sur 9')+row('Actions ouvertes','Registre fictif','6 actions')+row('Objectifs à examiner','Pilotage du SMSI','3 objectifs'))}</div><section class="panel" style="margin-top:18px"><div class="panel-head"><h2>Prochaines étapes</h2>${badge('CALENDRIER ILLUSTRATIF')}</div><div class="timeline">${['Préparer les éléments','Réunir les pilotes','Arbitrer en direction','Suivre les décisions'].map((x,i)=>`<article><span class="small muted">ÉTAPE 0${i+1}</span><h3>${x}</h3><p>${['Indicateurs et faits marquants','Risques, dépendances et besoins','Priorités, ressources et responsables','Échéances et preuves de réalisation'][i]}</p></article>`).join('')}</div></section>`;}
window.renderStyle=(theme,index)=>{let t=theme,view=views[index];document.documentElement.style.cssText=Object.entries(t).filter(([k,v])=>typeof v==='string'&&['bg','surface','soft','ink','muted','line','nav','accent','alt','font'].includes(k)).map(([k,v])=>`--${k}:${v}`).join(';')+`;--radius:${t.radius}px;--button-ink:${['dark','technical','luxury'].includes(t.treatment)?t.bg:'#fff'}`;document.body.className=t.layout+' '+t.treatment;document.querySelector('#app').innerHTML=`<aside><div class="brand"><span class="mark">A</span><span class="brand-copy">ASTRA<small>GOUVERNANCE CYBERSÉCURITÉ</small></span></div><nav><div class="nav-heading">PILOTAGE & GOUVERNANCE</div>${[['◉','Cockpit RSSI'],['▤','Processus du SMSI'],['◇','Risques et études'],['☷','Conformité'],['✓','Plans d’action']].map(([ic,l],i)=>`<div class="nav-item ${i===1?'on':''}"><span class="nav-icon">${ic}</span><span class="nav-label">${l}</span></div>`).join('')}<div class="nav-heading nav-secondary" style="margin-top:28px">ORGANISATION</div><div class="nav-item nav-secondary"><span class="nav-icon">◎</span><span class="nav-label">Périmètres</span></div><div class="nav-item nav-secondary"><span class="nav-icon">▦</span><span class="nav-label">Référentiels</span></div></nav><div class="nav-bottom">ORGANISATION DE DÉMONSTRATION<br>Environnement fictif<br><br>${t.name}</div></aside><main><header class="topbar"><span>Gouvernance &nbsp; / &nbsp; Processus du SMSI &nbsp; / &nbsp; <b>${view[1]}</b></span><div class="top-right"><div class="search">Rechercher dans le SMSI <span>⌕</span></div><div class="avatar">RS</div></div></header><div class="proposal">PROPOSITION VISUELLE ${t.id.slice(0,2)} · ${t.name.toUpperCase()} · DONNÉES FICTIVES</div><div class="page-title"><div><h1>${index===0?'Cartographie des processus du SMSI':view[1]}</h1><p class="subtitle">${view[2]} · Périmètre : organisation de démonstration</p></div><div class="actions"><span class="btn">Exporter</span><span class="btn primary">${index===5?'Modifier le processus':'Consulter le registre'}</span></div></div><div class="tabs">${['Cartographie','Processus','Interactions','Indicateurs','Responsabilités'].map((l,i)=>`<span class="tab ${[0,1,1,1,2,1,1,3,4,0][index]===i?'on':''}">${l}</span>`).join('')}</div><div class="stats">${[['Processus','9','3 familles'],['Pilotes','9','Responsabilités identifiées'],['Interfaces','12','Échanges documentés'],['Prochaine revue','30 nov.','Date illustrative']].map(([l,v,sub])=>`<article class="stat"><div class="label">${l}</div><div class="value">${v}</div><small>${sub}</small></article>`).join('')}</div>${content(index)}<footer class="footer"><span>ASTRA · Maquette de style · ${t.name}</span><span>Vue ${String(index+1).padStart(2,'0')} / 10 · Aucune fonctionnalité supplémentaire activée</span></footer></main>`;document.title=t.name+' — '+view[1];return {style:t.id,view:view[0]};};
window.views=views;
if(location.protocol!=='file:'){fetch('styles.json').then(r=>r.json()).then(ts=>{const p=new URLSearchParams(location.search);renderStyle(ts.find(t=>t.id===p.get('style'))||ts[0],Math.max(0,Math.min(9,Number(p.get('view')||1)-1)));});}
</script></html>

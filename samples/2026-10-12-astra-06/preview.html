/* Touches sauge issues de modules/integration.css ; structure et palette marine/turquoise conservées. */
:root{--sage:#84a28c;--sage-line:#74967c;--sage-soft:#e4eee6;--sage-ink:#244b32}
.stat:nth-child(2),.stat:nth-child(4){border-top-color:var(--sage)}
.badge:not(.warn):not(.high):not(.blue){background:var(--sage-soft);color:var(--sage-ink)}
.progress{background:#eef3ef}.progress b{background:var(--sage-line)}
.notice{background:#eef3ef;border-left-color:var(--sage-line);color:#354f3f}
.avatar{background:var(--sage-soft);color:var(--sage-ink)}
.tile .hex{background:var(--sage-soft);color:var(--sage-ink)}
.column:last-child{background:#e8eee9}.column:last-child .task{border-top-color:var(--sage-line)}
.side-bottom:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sage);margin-right:7px}

const views=[['01-cockpit','Cockpit RSSI','Une vision claire pour piloter votre sécurité.'],['02-registre-risques','Registre des risques','Identifier, décider et suivre les traitements.'],['03-detail-risque','Indisponibilité des services critiques','R-004 · Périmètre organisation de démonstration'],['04-annexe-a','Annexe A · ISO 27001:2022','Relier les mesures, documenter les preuves, suivre les revues.'],['05-plan-actions','Plan d’action','Des priorités partagées et des engagements visibles.'],['06-audits','Programme d’audit','Préparer les missions et suivre les constats.'],['07-preuves','Bibliothèque de preuves','Retrouver les pièces utiles aux contrôles et aux audits.'],['08-perimetres','Périmètres du SMSI','Organiser le pilotage par activité et par responsabilité.'],['09-continuite','Continuité d’activité','Préparer la reprise des services essentiels.'],['10-revue-direction','Revue de direction','Des faits, des décisions et un suivi dans le temps.']];

function body(n){
if(n===0)return stats([['24','Risques suivis'],['18 / 24','Actions terminées'],['72 %','Mesures documentées'],['3','Audits planifiés']])+`<div class="grid">${panel('Vos priorités du moment',row('Tester la restauration des sauvegardes','ACT-012 · Équipe infrastructure · 20 octobre','À traiter','warn')+row('Réviser les habilitations sensibles','ACT-018 · Responsable SSI · 24 octobre','En cours')+row('Préparer la revue de direction','REV-003 · Direction · 30 octobre','Planifié','blue'),badge('Cette semaine','blue'))}${panel('Vos repères SSI',`<p>Mesures avec une preuve associée</p><div class="metric">72 <small style="font-size:18px">%</small></div><div class="progress"><b style="width:72%"></b></div><p class="tiny">67 mesures sur 93 · Jeu de démonstration</p>${row('Revues de risques à préparer','Au cours des 30 prochains jours','4 revues','warn')}`)}</div>`+service('Votre prochain rendez-vous : la revue de direction','Rassemblez les risques prioritaires, les résultats d’audit et les décisions attendues.','Préparer la revue');

if(n===2)return `<div class="split">${panel('Appréciation et décision',badge('Risque élevé','high')+`<p>Une interruption prolongée du socle technique empêche les équipes d’accéder aux services essentiels.</p>${[['Propriétaire','Équipe infrastructure'],['Périmètre','Infrastructure et services partagés'],['Évaluation','Impact 4 / 5 · Vraisemblance 3 / 5'],['Décision','Réduire le risque'],['Prochaine revue','30 novembre 2026']].map(([a,b])=>`<div class="fact"><span>${a}</span><strong>${b}</strong></div>`).join('')}`)}${panel('Mesures liées · Annexe A',row('A.8.13 · Sauvegarde de l’information','Lien direct avec le risque','Liée')+row('A.8.14 · Redondance','Lien direct avec le risque','Liée')+note('Relier une mesure ne valide pas sa mise en œuvre et ne réduit pas automatiquement le risque résiduel.')+`<div class="actions bottom"><span class="btn primary">Lier / délier des mesures</span></div>`)}</div>`+service('Plan de traitement associé','ACT-012 · Tester la restauration · Échéance : 20 octobre 2026','Consulter l’action');

if(n===4)return `<div class="listbar"><span>Liste</span><span class="selected">Kanban</span><span>Calendrier</span></div><div class="kanban">${[['À planifier','2',[['Réviser la procédure fournisseur','ACT-024','Responsable achats','28 oct.'],['Mettre à jour le registre des actifs','ACT-026','Support SI','04 nov.']]],['En cours','2',[['Tester les restaurations','ACT-012','Équipe infrastructure','20 oct.'],['Revoir les comptes privilégiés','ACT-018','Responsable SSI','24 oct.']]],['Terminées','2',[['Valider la politique SSI','ACT-003','Direction','02 oct.'],['Clôturer la campagne de sensibilisation','ACT-009','RH','08 oct.']]]].map(([h,c,ts])=>`<section class="column"><h3>${h} ${badge(c,'blue')}</h3>${ts.map(([t,id,o,d])=>`<article class="task"><div class="eyebrow">${id}</div><h3>${t}</h3><p>${o}</p><div class="task-footer"><span>◷ ${d}</span><span>Voir l’action →</span></div></article>`).join('')}</section>`).join('')}</div>`+note('Vue illustrative du suivi des actions. Les dates, responsables et activités sont fictifs.');
if(n===5)return stats([['3','Audits planifiés'],['1','Mission en cours'],['8','Constats à suivre'],['12','Preuves collectées']])+panel('Votre programme 2026',table(['Mission','Périmètre','Période','Pilote','Avancement'],[['AUD-006 · Gestion des habilitations','Identités et accès','12–16 octobre','Équipe audit',badge('En cours')],['AUD-007 · Continuité des services','Infrastructure','09–13 novembre','Équipe audit',badge('Planifié','blue')],['AUD-008 · Maîtrise des prestataires','Fournisseurs','23–25 novembre','Équipe audit',badge('À préparer','warn')]]))+service('Préparez votre prochaine mission','Définissez les objectifs, le périmètre et les pièces attendues.','Ouvrir le programme');

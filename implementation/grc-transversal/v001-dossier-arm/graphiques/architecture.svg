<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#328C87"/></marker></defs><rect width="1500" height="980" fill="#F5F5F0"/><g font-family="Arial" fill="#173F34"><text x="60" y="65" font-size="32" font-weight="bold">Architecture cible · Trois couches, des identités partagées</text><text x="60" y="100" font-size="18" fill="#52645E">Proposition additive sur legacy • Source de vérité conservée • Versions épinglées par étude</text><rect x="60" y="155" width="655" height="185" rx="14" fill="white" stroke="#DCE2DB" stroke-width="2"/><rect x="60" y="155" width="6" height="185" rx="3" fill="#328C87"/><text x="86" y="195" font-size="18" font-weight="bold">A · REGISTRES CANONIQUES</text><text x="86" y="233" font-size="17" fill="#52645E">Fournisseurs · périmètres · rôles · processus</text><text x="86" y="260" font-size="17" fill="#52645E">Risques · mesures · actions · preuves existants</text><text x="86" y="287" font-size="17" fill="#52645E">Nouveaux objets seulement si le concept est absent</text><rect x="785" y="155" width="655" height="185" rx="14" fill="white" stroke="#DCE2DB" stroke-width="2"/><rect x="785" y="155" width="6" height="185" rx="3" fill="#328C87"/><text x="811" y="195" font-size="18" font-weight="bold">A · CONFIGURATIONS VERSIONNÉES</text><text x="811" y="233" font-size="17" fill="#52645E">Échelles · critères · catégories · profils · matrices</text><text x="811" y="260" font-size="17" fill="#52645E">Portée explicite : global autorisé / organisation</text><text x="811" y="287" font-size="17" fill="#52645E">Publication immuable · dépendances exactes</text><rect x="785" y="410" width="655" height="160" rx="14" fill="white" stroke="#DCE2DB" stroke-width="2"/><rect x="785" y="410" width="6" height="160" rx="3" fill="#328C87"/><text x="811" y="450" font-size="18" font-weight="bold">B · MÉTHODES PUBLIÉES</text><text x="811" y="488" font-size="17" fill="#52645E">EBIOS RM · ISO 27005 · personnalisées</text><text x="811" y="515" font-size="17" fill="#52645E">Étapes, contrats et validateurs spécifiques</text><rect x="60" y="640" width="920" height="195" rx="14" fill="white" stroke="#DCE2DB" stroke-width="2"/><rect x="60" y="640" width="6" height="195" rx="3" fill="#328C87"/><text x="86" y="680" font-size="18" font-weight="bold">C · ÉTUDES ET ÉVALUATIONS CONTEXTUELLES</text><text x="86" y="718" font-size="17" fill="#52645E">Contexte épinglé : méthode + configurations + révisions des objets</text><text x="86" y="745" font-size="17" fill="#52645E">Observations et scénarios → registre central des évaluations de risque</text><text x="86" y="772" font-size="17" fill="#52645E">Traitement, décision humaine, suivi et nouvelle révision explicite</text><rect x="1030" y="640" width="410" height="195" rx="14" fill="white" stroke="#DCE2DB" stroke-width="2"/><rect x="1030" y="640" width="6" height="195" rx="3" fill="#328C87"/><text x="1056" y="680" font-size="18" font-weight="bold">SERVEUR LEGACY</text><text x="1056" y="718" font-size="17" fill="#52645E">Sessions / CSRF / permissions</text><text x="1056" y="745" font-size="17" fill="#52645E">Projection et fusion par périmètre</text><text x="1056" y="772" font-size="17" fill="#52645E">Validation, concurrence et audit</text><text x="1056" y="799" font-size="17" fill="#52645E">SQLite : état JSON conservé</text><path d="M385 340V610H420V640" fill="none" stroke="#328C87" stroke-width="3" marker-end="url(#a)"/><path d="M1100 340V410" fill="none" stroke="#328C87" stroke-width="3" marker-end="url(#a)"/><path d="M950 570V610H720V640" fill="none" stroke="#328C87" stroke-width="3" marker-end="url(#a)"/><path d="M1030 740H980" fill="none" stroke="#328C87" stroke-width="3" marker-end="url(#a)"/><text x="60" y="912" font-size="19" fill="#A23850">Invariant : partager un objet ne partage pas automatiquement son évaluation.</text><text x="60" y="948" font-size="16" fill="#52645E">Cartographie dynamique protégée · Aucun registre concurrent · Aucun recalcul des historiques sans nouvelle évaluation</text></g></svg>
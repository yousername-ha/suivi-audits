          <span class="nav__org" id="nav-org">GHT Val-d’Ombre</span>
        </span>

          <svg class="icone" aria-hidden="true"><use href="#i-chevron-gauche"/></svg>
        </button>
      </div>

        </div>

    <div class="modale__boite" role="dialog" aria-modal="true" aria-labelledby="modale-titre" aria-describedby="modale-texte" tabindex="-1">
      <div class="modale__entete">
        <h2 class="modale__titre" id="modale-titre">Clôturer l’audit ?</h2>
        <button class="bouton bouton--icone bouton--fantome" type="button" data-fermer-modale aria-label="Fermer la fenêtre">
          <svg class="icone" aria-hidden="true"><use href="#i-fermer"/></svg>
        </button>
      </div>
      <p class="modale__texte" id="modale-texte"></p>
      <div class="modale__pied">
        <button class="bouton bouton--defaut" type="button" data-fermer-modale>Annuler</button>
        <button class="bouton bouton--plein" type="button" id="modale-confirmer">Confirmer la clôture</button>
      </div>
    </div>

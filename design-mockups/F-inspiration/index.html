  <div class="fond" aria-hidden="true">
    <div class="fond__halo fond__halo--sarcelle"></div>

    <div class="fond__grille"></div>
  </div>

  <a class="evitement" href="#contenu">Aller au contenu</a>

    <a class="entete__marque" href="#/dashboard" aria-label="Suivi des audits SMSI, retour au tableau de bord">
      <span class="entete__logo" aria-hidden="true"><svg class="icone"><use href="#i-bouclier"></use></svg></span>
      <span class="entete__titres">
        <span class="entete__titre">Suivi des audits SMSI</span>
        <span class="entete__sous-titre" id="entete-organisation"></span>
      </span>
    </a>

    <nav class="nav" aria-label="Navigation principale">
      <ul class="nav__liste" id="nav-liste">
        <li><a href="#/dashboard" data-route="dashboard"><svg class="icone" aria-hidden="true"><use href="#i-dashboard"></use></svg><span>Tableau de bord</span></a></li>
        <li><a href="#/audits" data-route="audits"><svg class="icone" aria-hidden="true"><use href="#i-audits"></use></svg><span>Audits</span></a></li>
        <li><a href="#/audit/AUD-07" data-route="audit"><svg class="icone" aria-hidden="true"><use href="#i-fiche"></use></svg><span>Fiche audit</span></a></li>
        <li><a href="#/formulaire" data-route="formulaire"><svg class="icone" aria-hidden="true"><use href="#i-formulaire"></use></svg><span>Nouvel audit</span></a></li>
        <li><a href="#/retex" data-route="retex"><svg class="icone" aria-hidden="true"><use href="#i-retex"></use></svg><span>RETEX</span></a></li>

        <li class="nav__indicateur" aria-hidden="true"></li>
      </ul>
    </nav>

        <span class="segment__legende" id="segment-animations-legende">Animations</span>
        <button type="button" class="segment__option" data-valeur="on" aria-pressed="true">Activées</button>
        <button type="button" class="segment__option" data-valeur="off" aria-pressed="false">Désactivées</button>
        <span class="segment__capsule" aria-hidden="true"></span>
      </div>
      <div class="pastille pastille--utilisateur" id="entete-utilisateur" role="group" aria-label="Utilisateur connecté">
        <span class="avatar" aria-hidden="true" id="entete-avatar"></span>
        <span class="pastille__texte" id="entete-nom"></span>
        <span class="point point--vert" aria-hidden="true"></span>
        <span class="pastille__meta" id="entete-role"></span>
      </div>
    </div>
  </header>

  <main id="contenu" class="contenu" tabindex="-1">
    <div id="vue" class="vue" aria-live="off"></div>
  </main>

  <div id="infobulle" class="infobulle" role="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="modale-racine"></div>

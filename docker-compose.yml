# Suivi des audits SMSI ISO 27001 / HDS — déploiement de production.
#   web (Caddy : HTTPS + interface)  ->  app (API Node.js)  ->  db (PostgreSQL 17)
# Images versionnées publiées sur GHCR : mise à jour = changer APP_VERSION dans .env, puis
#   docker compose pull && docker compose up -d
# Réseaux : seul « web » est exposé ; « app » et « db » n'ont aucun accès sortant.
# Données (EXPL-01) : toutes dans le dossier du serveur DATA_DIR (montages bind), aucune dans les conteneurs ni dans
# des volumes Docker. Supprimer les conteneurs, les images ou lancer « docker compose down -v » ne les touche pas.
#   DATA_DIR/postgres  base · secrets  secrets générés · caddy/data, caddy/config  certificats · clamav  signatures
#   DATA_DIR/etat      rapports des scripts du serveur (mises à jour, sauvegardes, version disponible)

name: suivi-audits

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

x-data-dir: &data-dir ${DATA_DIR:-/srv/suivi-audits/donnees}

x-api-image: &api-image ghcr.io/yousername-ha/suivi-audits-api:${APP_VERSION:?Renseigner APP_VERSION dans .env}

services:
  # À chaque démarrage : contrôle et prépare DATA_DIR (dossiers, propriétaires, droits), génère les secrets
  # manquants, puis s'arrête. Refuse de démarrer sur un DATA_DIR non préparé ou mal placé.
  init:
    image: *api-image
    user: '0:0'
    command: ['node', 'dist/init-secrets.js']
    environment:
      DONNEES: /donnees
      DATA_DIR_HOTE: *data-dir
      PROJET: /projet
    volumes:
      - ${DATA_DIR:-/srv/suivi-audits/donnees}:/donnees
      # Dossier de l'application, en lecture seule : vérifie que DATA_DIR n'y est pas.
      - .:/projet:ro
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  db:
    <<: *hardening
    image: postgres:17-alpine
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=peer --data-checksums'
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_line_prefix=%m [%p] %q%u@%d %h
      - -c
      - max_connections=50
    volumes:
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/postgres:/var/lib/postgresql/data
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/secrets:/run/secrets:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    read_only: true
    tmpfs:
      - /var/run/postgresql:mode=3777,size=8m
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    shm_size: 128m
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d suivi -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    <<: *hardening
    image: *api-image
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DB_HOST: db
      SECRETS_DIR: /run/secrets
      TRUST_PROXY: '1'
      PUBLIC_URL: https://${SITE_ADDRESS:?Renseigner SITE_ADDRESS dans .env}
      ETAT_DIR: /etat
      DATA_DIR_HOTE: *data-dir
    volumes:
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/secrets:/run/secrets:ro
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/etat:/etat:ro
    networks: [backend, edge]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 200

  web:
    <<: *hardening
    image: ghcr.io/yousername-ha/suivi-audits-web:${APP_VERSION:?Renseigner APP_VERSION dans .env}
    depends_on:
      app: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Renseigner SITE_ADDRESS dans .env}
      CADDY_TLS: ${CADDY_TLS:-internal}
      TLS_WEB_MANAGEMENT: ${TLS_WEB_MANAGEMENT:-0}
      TLS_TERMINATION: ${TLS_TERMINATION:-caddy}
    ports:
      - '${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:8443'
      - '${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:8080'
    volumes:
      - ./certs:/certs:ro
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/secrets/tls-web:/certs-web:ro
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/caddy/data:/data
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/caddy/config:/config
    networks: [public, edge]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    mem_limit: 256m

  # Antivirus facultatif : docker compose --profile antivirus up -d  (et CLAMAV_HOST=clamav dans .env)
  clamav:
    <<: *hardening
    image: clamav/clamav:stable
    profiles: ['antivirus']
    networks: [backend, av_update]
    depends_on:
      init: { condition: service_completed_successfully }
    volumes:
      - ${DATA_DIR:-/srv/suivi-audits/donnees}/clamav:/var/lib/clamav
    mem_limit: 3g

networks:
  public: {}
  edge: { internal: true }
  backend: { internal: true }
  av_update: {}

# Aucun volume nommé : voir DATA_DIR ci-dessus. Les anciens volumes (pgdata, secrets, caddy_data, caddy_config,
# clamav_db) sont repris par scripts/migrer-donnees-vers-dossier.sh.

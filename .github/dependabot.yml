# Mises à jour proposées en pull request, jamais fusionnées automatiquement (ADR 0063).
# Actions GitHub : épinglées par empreinte de commit ; Dependabot propose la nouvelle empreinte avec sa version en
# commentaire. Chaque proposition passe par la CI complète et la relecture du RSSI.
# Les propositions visent claude-suivi-smsi, jamais main (directive commune du 27/10/2026, AGENTS « Sessions parallèles »).
# Dependabot lit ce fichier sur la branche par défaut : le réglage s'applique une fois arrivé sur main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: claude-suivi-smsi
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-github:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /docker
    target-branch: claude-suivi-smsi
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope

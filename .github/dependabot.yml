# Mises à jour proposées en pull request, jamais fusionnées automatiquement (ADR 0063).
# Actions GitHub : épinglées par empreinte de commit ; Dependabot propose la nouvelle empreinte avec sa version en
# commentaire. Chaque proposition passe par la CI complète et la relecture du RSSI.
# Les propositions visent claude-suivi-smsi, jamais main (directive commune du 27/10/2026, AGENTS « Sessions parallèles »).
# Dependabot lit ce fichier sur la branche par défaut : le réglage s'applique une fois arrivé sur main.
# Quarantaine de 7 jours (cooldown) : une version n'est proposée qu'une semaine après sa publication, délai qui laisse
# le temps de détecter un paquet compromis (attaques de type « Shai-Hulud », TeamPCP). Les alertes de sécurité
# Dependabot ne sont pas concernées par ce délai.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: claude-suivi-smsi
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-github:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /docker
    target-branch: claude-suivi-smsi
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
  # Dépendances npm (espace de travail pnpm, pnpm-lock.yaml) : correctifs et mineures regroupés en une PR ; chaque
  # majeure arrive seule, car elle exige une lecture des notes de version et la validation du RSSI (ADR 0009).
  - package-ecosystem: npm
    directory: /
    target-branch: claude-suivi-smsi
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-correctifs-mineures:
        update-types: ['minor', 'patch']

# Analyse statique de sécurité (CodeQL) du code JavaScript, TypeScript et Python.
# Le dépôt est privé, sans « code scanning » activé : les résultats ne sont pas envoyés à GitHub mais publiés en
# artefact SARIF, et le job échoue sur toute alerte de gravité élevée ou critique (security-severity >= 7).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL (JavaScript / TypeScript / Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, python
          queries: security-extended
          config: |
            paths-ignore:
              - '**/dist'
            # js/missing-rate-limiting ne reconnaît que les intergiciels connus (express-rate-limit…). Toutes les
            # routes passent par un point d'entrée unique (apps/api/src/http/route.ts) qui applique une limite
            # globale par IP avant toute lecture en base (testée : security.test.ts, « limite globale de débit »),
            # en plus des limites dédiées (connexion, double authentification, jeton d'installation, présence).
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/security-extended'
          upload: never
          output: codeql-sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-sarif/
      - name: Alertes (échec si gravité élevée ou critique)
        run: |
          node -e '
            const fs = require("fs");
            let high = 0, total = 0;
            for (const f of fs.readdirSync("codeql-sarif").filter((f) => f.endsWith(".sarif"))) {
              for (const run of JSON.parse(fs.readFileSync("codeql-sarif/" + f, "utf8")).runs) {
                const rules = new Map();
                for (const r of [run.tool.driver, ...(run.tool.extensions || [])].flatMap((c) => c.rules || [])) rules.set(r.id, r);
                for (const res of run.results || []) {
                  total++;
                  const rule = rules.get(res.ruleId) || {};
                  const sev = parseFloat((rule.properties || {})["security-severity"] || "0");
                  const loc = res.locations?.[0]?.physicalLocation;
                  const where = loc ? `file=${loc.artifactLocation.uri},line=${loc.region?.startLine || 1}` : "";
                  const level = sev >= 7 ? "error" : "warning";
                  if (sev >= 7) high++;
                  const at = loc ? ` [${loc.artifactLocation.uri}:${loc.region?.startLine || 1}]` : "";
                  console.log(`::${level} ${where}::CodeQL ${res.ruleId} (gravité ${sev || "n/a"})${at} : ${res.message.text.replace(/\n/g, " ")}`);
                }
              }
            }
            console.log(`${total} alerte(s), dont ${high} de gravité élevée ou critique.`);
            if (high) process.exit(1);
          '

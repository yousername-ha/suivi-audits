# Publication d'une version : sur une étiquette vX.Y.Z uniquement.
# Images ghcr.io/yousername-ha/suivi-audits-api et suivi-audits-web, étiquetées X.Y.Z et X.Y, signées avec cosign
# (signature sans clé, identité OIDC de ce workflow), accompagnées de leur SBOM CycloneDX attesté.
name: Publication

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  images:
    name: Images ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Trivy (échec sur CRITICAL) et SBOM
        env:
          REF: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -e
          trivy() { docker run --rm -v "$HOME/.docker:/root/.docker:ro" -v "$PWD:/work" -w /work aquasec/trivy:0.75.0 "$@"; }
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$REF"
          trivy image --format cyclonedx --output sbom.cdx.json "$REF"
      - uses: sigstore/cosign-installer@v3
      - name: Signature et attestation SBOM (cosign, sans clé)
        env:
          REF: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.image }}
          path: sbom.cdx.json

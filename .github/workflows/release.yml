# Publication d'une version : sur une étiquette vX.Y.Z uniquement (EXPL-07).
# Images ghcr.io/yousername-ha/suivi-audits-api et suivi-audits-web, étiquetées X.Y.Z et X.Y, signées avec cosign
# (signature sans clé, identité OIDC de ce workflow, vérifiée par scripts/mettre-a-jour.sh), accompagnées de leur SBOM
# CycloneDX attesté ; puis page de la version reprenant sa section du CHANGELOG, avec son paragraphe obligatoire
# « Notes de mise à jour » (publication refusée sans lui).
name: Publication

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  notes:
    name: Notes de version (CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Section de la version et « Notes de mise à jour »
        run: node scripts/ci/verifier-changelog.mjs CHANGELOG.md --section "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: notes
          path: notes.md

  images:
    needs: [notes]
    name: Images ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [api, web, updater]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Trivy (échec sur HIGH et CRITICAL) et SBOM
        env:
          REF: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -e
          trivy() { docker run --rm -v "$HOME/.docker:/root/.docker:ro" -v "$PWD:/work" -w /work aquasec/trivy:0.75.0 "$@"; }
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$REF"
          trivy image --format cyclonedx --output sbom.cdx.json "$REF"
      - uses: sigstore/cosign-installer@v3
      - name: Signature et attestation SBOM (cosign, sans clé)
        env:
          REF: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-${{ matrix.image }}
          path: sbom.cdx.json

  page:
    name: Page de la version
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: notes
      - uses: actions/download-artifact@v5
        with:
          pattern: sbom-*
          merge-multiple: false
      - name: Publication de la page (notes de version, SBOM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for d in sbom-api sbom-web sbom-updater; do mv "$d/sbom.cdx.json" "suivi-audits-${d#sbom-}.cdx.json"; done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Version ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md suivi-audits-api.cdx.json suivi-audits-web.cdx.json suivi-audits-updater.cdx.json

# Publication sur une étiquette vX.Y.Z uniquement. Manifeste du commit : stable depuis main,
# development depuis la branche de travail, préversion GitHub et seule étiquette d'image X.Y.Z.
# Les versions installables ne sont exposées qu'après les contrôles, scans et signatures des trois images.
name: Publication

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Notes de version (CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # Aucun paquet n'est installé dans ce job ; ne pas chercher pnpm pour un cache automatique.
          package-manager-cache: false
      - id: plan
        name: Source de publication et contrôles du commit exact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/preparer-publication.mjs
      - name: Section de la version et « Notes de mise à jour »
        run: node scripts/ci/verifier-changelog.mjs CHANGELOG.md --section "${GITHUB_REF_NAME#v}" > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  # Trois jobs séparés (ADR 0063) : seul « sign » détient l'identité de signature ; Trivy, outil tiers, s'exécute
  # dans un job sans droit d'écriture ni identité, sur une archive de l'image, sans identifiants exposés.
  images:
    needs: [notes]
    name: Construction ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web, updater]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.version=${{ needs.notes.outputs.version }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          pull: true
          # Étiquette non installable par l'ancien exécutant, jusqu'au succès des trois images.
          tags: ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}:candidate-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Empreinte de l'image construite
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$DIGEST" > digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}
          path: digest.txt

  scan:
    needs: [images]
    name: Analyse ${{ matrix.image }} (Trivy, sans secret)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        image: [api, web, updater]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - name: Archive de l'image par empreinte (jeton en lecture, effacé avant l'analyse)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          digest=$(cat digest.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@$digest"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          docker pull --quiet "$ref" > /dev/null
          docker logout ghcr.io > /dev/null
          rm -f "$HOME/.docker/config.json"
          docker save -o "$RUNNER_TEMP/image.tar" "$ref"
      - name: Trivy (publication officielle, empreinte vérifiée)
        run: scripts/ci/installer-outils.sh trivy
      - name: Trivy (échec sur HIGH et CRITICAL) et SBOM
        run: |
          set -e
          trivy image --input "$RUNNER_TEMP/image.tar" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          trivy image --input "$RUNNER_TEMP/image.tar" --format cyclonedx --output sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom.cdx.json

  sign:
    needs: [images, scan]
    name: Signature ${{ matrix.image }} et attestation SBOM
    # Environnement protégé (ADR 0063) : la signature attend l'approbation du RSSI, et seule une étiquette v* y accède.
    # Sans signature, ni la page de la version ni l'installation ne sont possibles.
    environment: publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [api, web, updater]
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.image }}
      - name: Signature et attestation SBOM (cosign, sans clé) de l'empreinte analysée
        run: |
          set -euo pipefail
          digest=$(cat digest.txt)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="ghcr.io/yousername-ha/suivi-audits-${{ matrix.image }}@$digest"
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$ref"

  page:
    name: Page de la version
    needs: [notes, images, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: false
      - name: Vérification des signatures puis exposition des images installables
        env:
          VERSION: ${{ needs.notes.outputs.version }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$VERSION"
          for component in api web updater; do
            digest=$(cat "digest-$component/digest.txt")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            image="ghcr.io/$GITHUB_REPOSITORY-$component"
            cosign verify "$image@$digest" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            # L'exécutant refuse une image sans attestation SBOM signée : la vérifier avant toute exposition (ADR 0063).
            cosign verify-attestation "$image@$digest" --type cyclonedx --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            if existing=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' 2>/dev/null); then
              [ "$(jq -r .digest <<< "$existing")" = "$digest" ] || { echo 'Version déjà publiée avec une autre empreinte'; exit 1; }
            fi
          done
          for component in api web updater; do
            digest=$(cat "digest-$component/digest.txt")
            image="ghcr.io/$GITHUB_REPOSITORY-$component"
            docker buildx imagetools create --prefer-index=false --tag "$image:$VERSION" "$image@$digest"
            actual=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}')
            [ "$(jq -r .digest <<< "$actual")" = "$digest" ]
            if [ "$PRERELEASE" = false ]; then
              docker buildx imagetools create --prefer-index=false --tag "$image:${VERSION%.*}" "$image@$digest"
            fi
          done
      - name: Publication de la page (notes de version, SBOM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ needs.notes.outputs.title }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
        run: |
          set -e
          for d in sbom-api sbom-web sbom-updater; do mv "$d/sbom.cdx.json" "suivi-audits-${d#sbom-}.cdx.json"; done
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --title "$TITLE" "${options[@]}" \
            --notes-file notes.md suivi-audits-api.cdx.json suivi-audits-web.cdx.json suivi-audits-updater.cdx.json
      - name: Détection réelle par l'exécutant existant du dépôt privé
        if: needs.notes.outputs.prerelease == 'true'
        env:
          EXPECTED_VERSION: ${{ needs.notes.outputs.version }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, tempfile
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('updates', 'scripts/update-worker.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path('.env').write_text('APP_VERSION=3.0.0\n')
          with tempfile.TemporaryDirectory() as data:
              os.environ.update(REPO=os.getcwd(), DATA_DIR=data)
              worker = module.Worker()
              worker.check()
              assert worker.state['available'] == os.environ['EXPECTED_VERSION'], worker.state['available']
              assert not worker.state['checkError']
              print('Étiquette Git privée et trois images : détection réelle validée.')
          Path('.env').unlink()
          PY
